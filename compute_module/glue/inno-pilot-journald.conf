# Inno-Pilot journald drop-in (v3.3.2).
# Installed by deploy_inno_pilot_glue.sh as
#   /etc/systemd/journald.conf.d/60-inno-pilot.conf
#
# Why: Raspberry Pi OS ships Storage=volatile
# (/usr/lib/systemd/journald.conf.d/40-rpi-volatile-storage.conf), so the journal
# lived in RAM and every log line was lost on reboot.  On 2026-10-21 the only
# record of a REMOTE steering stop survived because the unit had not rebooted
# since; a power cycle at the helm would have erased it.  This file sorts after
# "40-rpi-..." and therefore wins.
#
# Size: capped at 64 MB on the SD card.  Debug mode logs roughly 30 MB/hour, so
# a long Debug session rotates out older entries; normal operation is far below.
[Journal]
Storage=persistent
SystemMaxUse=64M
SystemKeepFree=500M
